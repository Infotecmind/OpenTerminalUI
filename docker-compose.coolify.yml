# Coolify deployment: the APPLICATION and its cache only.
#
# The database is deliberately NOT here. It is a Coolify-managed PostgreSQL
# resource, which is what gives it scheduled backups, one-click restore and
# retention - none of which Coolify offers for a database buried inside a
# compose application. Same reasoning as landanalysis on this VPS.
#
# Redis IS here, on purpose: it holds cache, pub/sub and sessions. Losing it
# logs people out and re-warms the cache. Nothing in it is worth a backup
# policy, so it does not earn a managed resource.
#
# Why this file exists instead of the upstream docker-compose.yml, which
# targets a laptop and fails four ways on a public VPS:
#   1. postgres was gated behind `profiles: ["postgres"]`, so Coolify never
#      started it and the backend silently fell back to SQLite. Setting
#      OPENTERMINALUI_ENV=production makes backend/db/base.py refuse SQLite
#      outright, turning a silent fallback into a startup error.
#   2. Upstream published redis 6379 and postgres 5432 to the host. On a VPS
#      that is the public internet, and redis ships with no auth.
#   3. BOOTSTRAP_ADMIN_* defaulted to empty; scripts/seed_admin.py no-ops
#      without them and entrypoint.sh swallows it with `|| true`, leaving a
#      healthy app nobody can log into.
#   4. entrypoint.sh runs `alembic upgrade head` with nothing checking the
#      database is reachable first.
#
# Set these in Coolify's Environment Variables, NOT here:
#   DATABASE_URL          the Coolify Postgres resource's INTERNAL URL.
#                         MUST begin postgresql+asyncpg:// - if Coolify hands
#                         you a postgres:// URL, rewrite the scheme, because
#                         backend/db/base.py only normalises postgresql://
#                         and SQLAlchemy rejects postgres:// outright.
#   JWT_SECRET_KEY        openssl rand -hex 32
#   CACHE_SIGNING_KEY     openssl rand -hex 32
#   REDIS_PASSWORD        openssl rand -hex 24
#   BOOTSTRAP_ADMIN_*     without these you cannot log in

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Must be non-dev: backend/db/base.py refuses SQLite outside dev, which
      # is the guarantee that the managed Postgres is really being used.
      OPENTERMINALUI_ENV: "${OPENTERMINALUI_ENV:-production}"

      DATABASE_URL: "${DATABASE_URL:?point this at the Coolify Postgres resource, scheme postgresql+asyncpg://}"
      REDIS_URL: "${REDIS_URL:?set to redis://:PASSWORD@redis:6379/0, password matching REDIS_PASSWORD}"

      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?generate with: openssl rand -hex 32}"
      CACHE_SIGNING_KEY: "${CACHE_SIGNING_KEY:?generate with: openssl rand -hex 32}"

      # Required so the first deploy creates a login. seed_admin.py is
      # idempotent: once any user exists it no-ops, so leaving these set is safe.
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:?set to your admin email}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?set a strong generated password}"

      # Upstream defaults to localhost:5173, which blocks the browser in prod.
      OPENTERMINALUI_CORS_ORIGINS: "${OPENTERMINALUI_CORS_ORIGINS:?set to https://your-domain}"

      # Market data - all optional, the app has built-in fallback providers.
      FMP_API_KEY: "${FMP_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      KITE_API_KEY: "${KITE_API_KEY:-}"
      KITE_API_SECRET: "${KITE_API_SECRET:-}"
      KITE_ACCESS_TOKEN: "${KITE_ACCESS_TOKEN:-}"

      # No LM Studio on this VPS; falls back to the built-in sentiment engine.
      LM_STUDIO_ENABLED: "${LM_STUDIO_ENABLED:-false}"

      # AI research agent - optional.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-openrouter}"
      AGENT_MODEL: "${AGENT_MODEL:-openai/gpt-oss-20b:free}"
      AGENT_DEBATE_ENABLED: "${AGENT_DEBATE_ENABLED:-true}"
      AGENT_STRATEGY_LOOP_ENABLED: "${AGENT_STRATEGY_LOOP_ENABLED:-true}"
      OPENTERMINALUI_PREFETCH_ENABLED: "${OPENTERMINALUI_PREFETCH_ENABLED:-0}"
    volumes:
      - openterminalui_data:/data
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - coolify.managed=true

  redis:
    image: redis:7-alpine
    # No published ports: reachable only on the compose network.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?generate with: openssl rand -hex 24}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - openterminalui_redis_data:/data
    restart: unless-stopped
    labels:
      - coolify.managed=true

volumes:
  openterminalui_data:
  openterminalui_redis_data:
